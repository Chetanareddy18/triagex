<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TriageX - AI-assisted incident management with SLA automation and a tamper-evident audit trail." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TriageX</title>
    <script>
      try {
        const t = localStorage.getItem('tx-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
